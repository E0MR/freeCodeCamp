<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
  </head>

  <body>
    <main>
      <h1>Checkout</h1>

      <section>
        <h2>Your Cart</h2>
        <div class="cart-item">
          <img
            src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
            alt="A minimalist geometric cube product image"
          />
          <div>
            <strong>Abstract Geometric Cube</strong>
            <p style="margin: 0.25rem 0 0; color: #64748b">Qty: 1 | $29.99</p>
          </div>
        </div>
      </section>

      <section>
        <h2>Payment Information</h2>
        <form>
          <div class="form-group">
            <label for="card-name">
              Name on Card
              <span class="required-star" aria-hidden="true">*</span>
            </label>
            <input type="text" id="card-name" name="card-name" required />
          </div>

          <div class="form-group">
            <label for="card-number">
              Card Number
              <span class="required-star" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              id="card-number"
              name="card-number"
              required
              aria-describedby="card-number-help"
            />
            <p id="card-number-help" class="help-text">
              Please enter your 16-digit card number without spaces or dashes.
            </p>
          </div>

          <button type="submit">Complete Order</button>
        </form>
      </section>
    </main>
  </body>
</html>
